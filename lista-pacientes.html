<!DOCTYPE html>
<html lang="pt_BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="preload" href="https://unpkg.com/@supabase/supabase-js@2" as="script">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script>
      if(localStorage.getItem("sb-gnbbejevwbixsubblnua-auth-token") == null) {location.href='login.html';}
    </script>
    <link rel="stylesheet" href="css/main.css">
  </head>
  <body>
    <header style="min-height: 48px; background: #000000; color: #ffffff;">
      <middle-left-box style="padding-left: 16px;"><a href="profissional.html">Início</a></middle-left-box>
      <middle-center-box>Listagem de pacientes</middle-center-box>
      <middle-right-box style="padding-right:9px;" onclick="(async () => {await sb.auth.signOut();location.href='login.html'})()">Sair...</middle-right-box>
    </header>
    <main>
      <div style="padding: 26px;">
        <h2>Informativo</h2>
        Este módulo permite que você liste pacientes com base nas condições fornecidas. <button onclick="exportarXLSX();">Baixar Planilha</button>  
        <br><br>
        <card-book>
          <card-box style="max-width: 192px;min-width: 192px;">
            <center-box>
              <h1 id="totalCadastros">...</h1>
            </center-box>
            <card-label>
              <center-box><b>Cadastros filtrados</b></center-box>
            </card-label>
          </card-box>
          <card-box style="max-width: 192px;min-width: 192px;">
            <center-box>
              <h1 id="percentualTotal">...</h1>
            </center-box>
            <card-label>
              <center-box><b>...em relação ao total de cadastros</b></center-box>
            </card-label>
          </card-box>
          <card-box style="max-width: 192px;min-width: 192px;">
            <center-box>
              <h1 id="percentualVinculados">...</h1>
            </center-box>
            <card-label>
              <center-box><b>...em relação aos cadastros vinculados</b></center-box>
            </card-label>
          </card-box>
        </card-book>
        <br><br>
        <hr>
        <br>
        <table id="listagem">
          <thead id="cabecalho">
          </thead>
          <tbody id="listaPacientes">
          </tbody>
        </table>
      </div>
    </main>
    <footer>
      <div>Esquerda rodapé</div>
      <div>Centro rodapé</div>
      <div>Direita rodapé</div>
    </footer>
    <script>
      ['card-book','card-box','card-label','list-item'].forEach((t) => customElements.define(t, class extends HTMLElement {}));
    </script>
    <script>
      const supabaseUrl = 'https://gnbbejevwbixsubblnua.supabase.co';
      const supabaseKey = 'sb_publishable_qwyezy8HKpxXhQZJdCcfXw_VsmZLmLA';
      let sb = supabase.createClient(supabaseUrl, supabaseKey);

      (async () => {
        let query = sb.from((new URLSearchParams(location.search)).get('t')).select((new URLSearchParams(location.search)).get('c'));
        
        let parametros = JSON.parse((new URLSearchParams(location.search)).get('q'));
        let operadorLogico = parametros["operadorLogico"];
        let sequenciaOr = "";

        delete parametros[""];
        delete parametros["operadorLogico"];


        for (let [coluna, valor] of Object.entries(parametros)) {
          if (coluna == "naoIncluirFA") {
            query = query.neq("micro_area", "FA");
            continue;
          }
          if (coluna == "unidade_saude" || coluna == "equipe" || coluna == "micro_area" || coluna == "sexo") {
            query = query.eq(coluna, valor);
            continue;
          }
          if (typeof valor == "string" && !coluna.startsWith("data_")) {
            query.ilike(coluna, `%${valor}%`);
            continue;
          }

          if (coluna.startsWith("data_")) {
            valor = parseInt(valor.replaceAll("-",""));
            coluna = `cod_${coluna}`;

            if (coluna.endsWith("$lte")) {
              coluna = coluna.replaceAll("$lte","");
              query = query.lte(coluna, valor);
              continue;
            }

            if (coluna.endsWith("$gte")) {
              coluna = coluna.replaceAll("$gte","");
              query = query.gte(coluna, valor);
              continue;
            }
          }

          if (typeof valor == "boolean" && operadorLogico === "or") {
            sequenciaOr += `${coluna}.eq.true,`;
            continue;
          }

          query = query.eq(coluna, valor);
        }

        if (operadorLogico === "or") {
          query.or(sequenciaOr.replace(/,$/,""))
        }

        const { data, error } = await query;
        let colunas = (new URLSearchParams(location.search)).get('c').split(",");
        let realinhar = ((new URLSearchParams(location.search)).get('r') || '').split(",");
        let naoQuebrar = ((new URLSearchParams(location.search)).get('w') || '').split(",");
        let tabela = "";
        let filtrados = 0;
        for (let linha of data) {
          tabela += `
            <tr>
          `;
          for (let coluna of colunas) {
              tabela += `<td style="text-align: ${realinhar.includes(coluna)?'right':'left'};text-wrap: ${naoQuebrar.includes(coluna)?'nowrap':'wrap'}">${linha[coluna] || ""}</td>`;
          }
          tabela += `
            </tr>
          `;

          filtrados += 1;
        }
        cabecalho.innerHTML = `<th>${JSON.parse((new URLSearchParams(location.search)).get('h')).join("</th><th>")}</th>`;
        listaPacientes.innerHTML = tabela;

        const {total_pacientes: totalGeral,total_pacientes_nao_fa: totalVinculado} = (await sb.from('total_pacientes').select('*')).data[0];

        totalCadastros.innerText = filtrados;
        percentualTotal.innerText = `${Math.round((filtrados / totalGeral) * 100 * 100) / 100}%`;
        percentualVinculados.innerText = `${Math.round(filtrados/totalVinculado * 100 * 100) / 100}%`;
        
      })();

      function exportarXLSX() {
        let data = [];

        for (let linha of document.getElementsByTagName('tr')) {
          let array = [];
          for (coluna of linha.children) {
            array.push(coluna.innerText);
          }
          data.push(array);
        }

        const ws = XLSX.utils.aoa_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Listagem-de-Pacientes");
        XLSX.writeFile(wb, "Listagem-de-Pacientes.xlsx");
      }
    </script>
  </body>
</html>
