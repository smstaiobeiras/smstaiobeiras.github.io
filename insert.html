/* App base  Layout*/

*,*::before,*::after {

html, body {

h1, h2, h3, h4, h5, h6, p, ul, ol, figure, blockquote, dl, dd {

ul, ol {

img, picture, video, canvas, svg {

button, input, select, textarea,dialog {

function criarLabel(input,texto){
  let label = document.createElement('label');
  label.htmlFor = input.id;

  let span = document.createElement('span');
  span.innerText = texto;
  span.style = "white-space: nowrap;"

  if (input.type === 'checkbox') {
    label.appendChild(input);
    label.appendChild(span);
    input.style = "margin-right: 8px;"
    return label;
  }

  label.appendChild(span);
  label.appendChild(input);

  label.style = "margin-bottom: 16px;"
  if (input.tagName === 'TEXTAREA') {
    input.style = "margin-top: 8px;"
    return label;
  }

  label.style = "display: flex;align-items: center;margin-bottom: 16px;"

  let style = "";
  if (input.type != 'text') style += "width: unset;"

  style += "margin-left: 8px;"

  input.style = style;

  return label;
}

function criarInput(id,descritor) {
  let input = document.createElement('input');
  switch (descritor.type) {
    case 'date':
      input.type = 'date';
    break;
    case 'time':
      input.type = 'time';
    break;
    case 'numeric':
      input.type = 'number';
    break;
    case 'url':
      input.type = 'url';
    break;
    case 'email':
      input.type = 'email';
    break;
    case 'varchar':
      input.type = 'text';
    break;
    case 'text':
      input = document.createElement("textarea");
    break;
    case 'boolean':
      input.type = 'checkbox';
      input.checked = descritor.default;
    break;
    case 'enum':
      input = document.createElement("select");
      input.innerHTML = '<option value="">Selecione</option>';
      for (let valor of descritor.values) {
        let option = document.createElement("option");
        option.value = valor;
        option.innerText = valor;

        input.appendChild(option);
      }
    break;
  }

  input.id = id;

  if (typeof descritor.minimo === 'number') input.min = descritor.minimo;
  if (typeof descritor.maximo === 'number') input.max = descritor.maximo;
  if (typeof descritor.passo === 'number') input.step = descritor.passo;
  if (typeof descritor.placeholder === 'string') input.placeholder = descritor.placeholder;
  if (descritor.default !== undefined && descritor.type != value) input.value = descritor.default;

  if (descritor.required) input.required = true;
  if (typeof descritor.requires === 'object') {
    input.readOnly = true;
    input.disabled = true;
    input.setAttribute("data-requires",JSON.stringify(descritor.requires));
  }

  input.onchange = () => {
    for (let campo of document.querySelectorAll(`input,select,textarea`)) {
      if (campo == input) continue;
      if (!campo.getAttribute("data-requires")) continue;
      let requirerimentos = JSON.parse(campo.getAttribute("data-requires"));
      if (!requirerimentos[input.id]) continue;

      campo.readOnly = true;
      campo.disabled = true;

      let operador = requirerimentos[input.id].split(" ")[0];
      let comparativo = requirerimentos[input.id].split(" ")[1];

      if (input.type === "checkbox") {
        if (operador == "=" && !((comparativo == "true") == input.checked)) continue;
        if (operador == "!" &&  ((comparativo == "true") == input.checked)) continue;
        campo.readOnly = false;
        campo.disabled = false;
        continue;
      }

      if (input.type === "number") {
        if (operador == "=" && (Number(comparativo) !=  Number(input.value))) continue;
        if (operador == "!" && (Number(comparativo) ==  Number(input.value))) continue;
        if (operador == ">" && !(Number(comparativo) <  Number(input.value))) continue;
        if (operador == "<" && !(Number(comparativo) >  Number(input.value))) continue;
        campo.readOnly = false;
        campo.disabled = false;
        continue;
      }

      if (input.type === "date") {
        if (operador == "=" && (Date.parse(comparativo) !=  Date.parse(input.value))) continue;
        if (operador == "!" && (Date.parse(comparativo) ==  Date.parse(input.value))) continue;
        if (operador == ">" && !(Date.parse(comparativo) <  Date.parse(input.value))) continue;
        if (operador == "<" && !(Date.parse(comparativo) >  Date.parse(input.value))) continue;
        campo.readOnly = false;
        campo.disabled = false;
        continue;
      }

      if (input.type === "time") {
        if (operador == "=" && (Number(comparativo.replaceAll(":")) !=  Number(input.value.replaceAll(":")))) continue;
        if (operador == "!" && (Number(comparativo.replaceAll(":")) ==  Number(input.value.replaceAll(":")))) continue;
        if (operador == ">" && !(Number(comparativo.replaceAll(":")) <  Number(input.value.replaceAll(":")))) continue;
        if (operador == "<" && !(Number(comparativo.replaceAll(":")) >  Number(input.value.replaceAll(":")))) continue;
        campo.readOnly = false;
        campo.disabled = false;
        continue;
      }

      if (operador == "=" && (comparativo != input.value)) continue;
      if (operador == "!" && (comparativo == input.value)) continue;
      campo.readOnly = false;
      campo.disabled = false;

    }
  }

  return criarLabel(input,descritor.label);
}

let campos = {
  nome : {
    label: 'Nome:',
    type: 'varchar'
  },
  perecivel : {
    label: 'É perecível?',
    type: 'boolean'
  },
  data_validade : {
    label: 'Data de validade:',
    type: 'date',
  },
  x : {
    label: 'Teste blab:',
    type: 'text',
  },
};

for (let [id,descritor] of Object.entries(campos)) {
  document.getElementById("formulario").appendChild(criarInput(id,descritor));
}
