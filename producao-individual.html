          </div>
          <div style="padding-top:4px;padding-bottom:12px;">
            <strong style="display:block;font-size:14px;font-weight:700;color:#1e293b;">Escolha o profissional</strong>
            <span style="font-size:13px;color:#64748b;">Apenas profissionais com produção registrada no e-SUS aparece</span>

        <div style="display:flex;gap:12px;align-items:flex-start;">

            <div style="width:28px;height:28px;border-radius:50%;background:#e2e8f0;border:2px solid #475569;color:#475569;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;">
              3

      <figure style="display:flex;align-items:flex-start;gap:12px;margin:10px 0;padding:12px 14px;background:#ede9fe;border-left:4px solid #5b21b6 !important;border-top:1px solid #c4b5fd !important;border-right:1px solid #c4b5fd;border-bottom:1px solid #c4b5fd;border-radius:0 10px 10px 0;cursor:default;user-select:none;">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="info" aria-hidden="true" style="width:20px;height:20px;flex-shrink:0;margin-top:1px;color:#5b21b6;" class="lucide lucide-info">

        </svg>
        <div style="flex:1;font-size:14px;color:#5b21b6;">

            Significado dos gráficos
          </strong>
          <span style="color:#334155;">
            Os gráficos representam atendimentos elegíveis aos respectivos indicadores. Para cada indicador, "Atendidos" 
            corresponde ao total de atendimentos que atendem aos critérios de elegibilidade e possuem a ação prevista em atraso. 
            "Realizado" corresponde aos atendimentos elegíveis nos quais a ação prevista para o indicador (Solicitar ou Avaliar)

      <br>
      <div>
        <label style="display: flex;align-content: center;">
          <span style="display: flex;align-items: center;padding-right: 9px !important;text-wrap: nowrap;">
            Filtrar por ocupação:
          </span>
          <select id="cbo" onchange="filtrarProfissionais();">

      </div>
      <br>
      <label style="display: flex;align-content: center;">
        <span style="display: flex;align-items: center;padding-right: 9px !important;">
          Profissional:
        </span>
        <select id="profissional" onchange="listarCompetencias(profissional.value);">
          <option>Selecione...</option>
        </select>
      </label>
      <hr>
      <label style="display: flex;align-content: center;">
        <span style="display: flex;align-items: center;padding-right: 9px !important;">
          Competência:
        </span>

      <hr>
      
      <a name="relatorios"></a>
      <table id="tabelaDiario">
      </table>
      <card-book id="graficosIndicadores" style="max-width: 1200px !important;">
      </card-book>

      <div style="padding: 32px;display: flex;flex-direction: column;gap: 18px;">
        <strong>Baixar relatório tabular com os dados</strong>
        <label>
          <input type="checkbox" id="todosOsCBOs">
          <span>Incluir todos os CBOs</span>
        </label>
        <label>
          <input type="checkbox" id="todosOsProfissionais">
          <span>Incluir todos os profissionais</span>
        </label>
        <label>
          <input type="checkbox" id="todasAsCompetencias">
          <span>Incluir todos as competências</span>
        </label>
        <div style="display: flex;flex-direction: column;gap: 18px;" id="checklist"></div>
        <button style="width: 200px;" onclick="baixarCSV();">Baixar CSV</button>

  <script>
      ['card-book','card-box','card-label','list-item'].forEach((t) => customElements.define(t, class extends HTMLElement {}));
    </script>
    <script>
      const supabaseUrl = 'https://qbtoodtbmtpperkgnvto.supabase.co';
      const supabaseKey = 'sb_publishable_TkUqh--zlwxQcIGdzXqePA_9pNd2sL2';
      let sb = supabase.createClient(supabaseUrl, supabaseKey);

      const meses = {
        // Código para nome
         1: 'Janeiro',
         2: 'Fevereiro',
         3: 'Março',
         4: 'Abril',
         5: 'Maio',
         6: 'Junho',
         7: 'Julho',
         8: 'Agosto',
         9: 'Setembro',
        10: 'Outubro',
        11: 'Novembro',
        12: 'Dezembro',
        // Nome para código
        'Janeiro': 1,
        'Fevereiro': 2,
        'Março': 3,
        'Abril': 4,
        'Maio': 5,
        'Junho': 6,
        'Julho': 7,
        'Agosto': 8,
        'Setembro': 9,
        'Outubro': 10,
        'Novembro': 11,
        'Dezembro': 12
      };

      function sanitizarNome(nome) {
        const palavrasMinusculas = new Set([
          'a', 'as',
          'o', 'os',
          'e',
          'de', 'da', 'das', 'do', 'dos',
          'em', 'na', 'nas', 'no', 'nos',
          'por', 'para',
          'com'
        ]);

        return nome.trim().split(/\s+/).map((palavra, index) => {
          const capitalizada = palavra.charAt(0).toUpperCase() + palavra.slice(1).toLowerCase();
          if (index > 0 && palavrasMinusculas.has(palavra.toLowerCase())) {
            return palavra.toLowerCase();
          }

          return capitalizada;
        }).join(' ');
      }

      const profissionais = {};
      const cbos = new Set();
      const competencias = new Set();
      const listagemProfissional = new Set;
      const cnsParaNome = {};
      const producao = {};

      function baixarCSV() {
        const cabecalho = [
          'Competência','CNS do Profissional','Nome do Profissional','CBOs','Total de atendimentos',
          ...[...checklist.querySelectorAll('input:checked')].map((e) => `Atendimentos para ${e.id};Registros de ${e.id};Registros de ${e.id} (%)`)
        ].join(";");
        const listagem = [];

        for (const [cns,competencias] of Object.entries(producao)) {
          for (const [competencia,registros] of Object.entries(competencias)) {
            const linha = [];
            if ((!todosOsCBOs.checked)) {
              if (!profissionais[cns].has(cbo.value) && (cbo.value != "Todas as ocupações")) continue;
            }
            if (!todosOsProfissionais.checked) {
              if (!(cns == profissional.value) && (profissional.value != "Selecionar profissional...")) continue;
            }
            if ((!todasAsCompetencias.checked) && (document.getElementById('competencia').value != "Selecione...")) {
              if (!(competencia == document.getElementById('competencia').value)) continue;
            }

            linha.push(`${(competencia/100)}`.split(".").reverse().join("/"));
            linha.push(cns,cnsParaNome[cns],[...profissionais[cns]].join(),registros.total);

            for (const [indicador,dados] of Object.entries(registros.indicadores)) {
              if (document.getElementById(indicador)?.checked) {
                linha.push(dados.Oportunidades,dados.Realizado,Math.ceil(dados.Realizado/dados.Oportunidades*100)||0);
              }
            }

            listagem.push(linha.join(";"));
          }
        }

        const downloadBlob = (blob, name) => 
          Object.assign(
            document.createElement('a'),{
              href: URL.createObjectURL(blob),
              download: name 
            }).click() || setTimeout(() => URL.revokeObjectURL(blob), 100)
        ;

        downloadBlob(new Blob(
          [new Uint8Array([0xEF, 0xBB, 0xBF]),[cabecalho,listagem.join("\n")].join("\n")],
          { type: "text/csv;charset=utf-8" }
        ),'Relatório de produção')
      }


      function filtrarProfissionais() {
        profissional.innerHTML = "<option>Selecionar profissional...</option>";
        profissional.innerHTML += ([...listagemProfissional].filter((e) => {
          if (cbo.value === 'Todas as ocupações') return true;
          return profissionais[e.cns].has(cbo.value);
        })).map((e)=>`<option value="${e.cns}">${e.nome}</option>`);
        graficosIndicadores.innerHTML = "";
        tabelaDiario.innerHTML = "";

        competencia.innerHTML = "<option>Selecione...</option>"
        competencia.innerHTML += [...competencias].reverse().map((e) => 
          `<option value="${e}">${`${(Number(e)/100).toFixed(2)}`.split('.').reverse().join('/')}</option>`
        ).join("");
      }

      function listarCompetencias(profissional) {
        competencia.innerHTML = "<option>Selecione...</option>"
        for (const comp of Object.keys(producao[profissional]).reverse()) {
          competencia.innerHTML += `<option value="${comp}">${(comp/100).toFixed(2).split('.').reverse().join("/")}</option>`;
        }
        graficosIndicadores.innerHTML = "";
        tabelaDiario.innerHTML = "";
      }

      function criarGrafico(container,percentual) {
        const cor = ((valor) => {
          if (valor >= 75) return "#3498db"; // Ótimo
          if (valor >= 50) return "#2ecc71"; // Bom
          if (valor >= 25) return "#f1c40f"; // Suficiente
          return "#e74c3c";                  // Regular
        })(percentual);

        let chart = new ApexCharts(document.getElementById(container),{
            series: [percentual],
            chart: {
              animations: {
                enabled: false
              },
              type: 'radialBar',
              offsetY: -20,
              sparkline: {
                enabled: true
              }
            },
            plotOptions: {
              radialBar: {
                  startAngle: -90,
                  endAngle: 90,
                  track: {
                    background: "#e7e7e7",
                    strokeWidth: '97%',
                    margin: 5
                  },
                dataLabels: {
                  name: {
                    show: false
                  },
                  value: {
                    offsetY: -2,
                    fontSize: '22px'
                  }
                }
              }
            },
            grid: {
              padding: {
                top: -10
              }
            },
            fill: {
              type: 'solid',
              colors: [cor]
            },
        });

        chart.render();
      }

      function mostrarProducao(profissional,competencia) {
        const diario = producao[profissional][competencia].diario;
        const indicadores = producao[profissional][competencia].indicadores;
        const total_atendimentos = producao[profissional][competencia].total;

        const cabecalhoTabela = Object.keys(diario[0]);
        cabecalhoTabela[0] = 'Turno';
        tabelaDiario.innerHTML = ('<thead><tr><th>'+cabecalhoTabela.join('</th><th>')+'</th></tr></thead>');
        tabelaDiario.innerHTML += ('<tbody>'+(diario.map((e) => '<tr><td>'+e.join('</td><td>')+'</td></tr>')).join('')+'</tbody>');
        tabelaDiario.querySelectorAll('td').forEach((e) => {
          if (Number(e.textContent) || e.textContent == '0') {
            e.style.textAlign = 'right';
            e.style.backgroundColor = e.textContent === '0' ? '#EB989A' : '#B2D9AB';
          }
        });

        for (const [indicador, dados] of Object.entries(indicadores)) {
          let cardbox = graficosIndicadores.appendChild(document.createElement("card-box"));
          cardbox.style="max-width: 256px;min-width: 580px;pointer-events: none;";
          cardbox.innerHTML = `
            <card-label>
              <center-box style="flex-direction:column;">
                <b>${indicador}</b>
              </center-box>
            </card-label>
            <center-box>
              <top-box style="flex-direction:column;padding-left:9px;">
                <table style="background-color:white;padding-right:9px;border: 0px solid;">
                  <tr style="background-color:white;padding-right:9px;border: 0px solid;">
                    <td style="background-color:white;padding-right:9px;border: 0px solid;">Atendimentos:</td>
                    <td style="background-color:white;text-align: right;border: 0px solid;">${dados.Oportunidades}</td>
                  </tr>
                  <tr style="background-color:white;padding-right:9px;border: 0px solid;">
                    <td style="background-color:white;padding-right:9px;border: 0px solid;">Registrados:</td>
                    <td style="background-color:white;text-align: right;border: 0px solid;">${dados.Realizado}</td>
                  </tr>
                </table>
              </top-box>
              <top-box style="flex-direction:column;padding-left:9px;">
                <div style="min-height: 128px;border: 0px;min-width: 256px;" id="grafico ${indicador}"></div>
              </top-box>
            </center-box>
          `;

          criarGrafico(`grafico ${indicador}`,Math.ceil(dados.Realizado/dados.Oportunidades*100) || 0);
        }
      }

      (async () => {
        const { data: atendimentos, error: erro_buscar_atendimentos } = await sb.from('atendimentos_profissional_nivel_superior').select('*');

        for (const atendimento of atendimentos) {
          if (!profissionais[atendimento.profissional]) {
            profissionais[atendimento.profissional] = new Set();
          }
          profissionais[atendimento.profissional].add(sanitizarNome(atendimento.cbo));
          cbos.add(sanitizarNome(atendimento.cbo));

          const competencia = `${atendimento.competencia}`;
          const ano = Number(competencia.substring(0, 4));
          const mes = Number(competencia.substring(4, 6));

          competencias.add(`${atendimento.competencia}`);
          
          const diario = atendimento.atendimentos.split("$").map((e) => e.split(","));
          diario.push(['Total']);

          for (let i = 1; i < diario[0].length; i++) {
            const data = new Date(ano, mes - 1, i);
            let l = diario.length-1;
            for (let j = 0; j < l; j++) {
              diario[j][i] = Number(diario[j][i]);
              diario[l][i] = diario[l][i] ? diario[l][i] + diario[j][i] : diario[j][i];

              if (data.getDay() === 0 || data.getDay() === 6) {
                diario[j][i] = '';
                diario[l][i] = '';
              }
            }
          }

          const indicadores = {
            "Antropometria Geral": {
              "Oportunidades": atendimento.total_atendimentos,
              "Realizado":  atendimento.antropometria_geral_realizados 
            },
            "Antropometria condicionados": {
              "Oportunidades": atendimento.antropometria_obrigatorios,
              "Realizado":  atendimento.antropometria_obrigatorios_realizados
            },
            "Citopatológico": {
              "Oportunidades": atendimento.cito_obrigatorios,
              "Realizado":  atendimento.cito_obrigatorios_solicitados
            },
            "Hemoglobina Glicada": {
              "Oportunidades": atendimento.hba1c_obrigatorios,
              "Realizado":  atendimento.hba1c_obrigatorios_solicitados
            },
            "Hepatite B (Gestante T1)": {
              "Oportunidades": atendimento.hep_b_t1_obrigatorios,
              "Realizado":  atendimento.hep_b_t1_obrigatorios_solicitados
            },
            "Hepatite C (Gestante T1)": {
              "Oportunidades": atendimento.hep_c_t1_obrigatorios,
              "Realizado":  atendimento.hep_c_t1_obrigatorios_solicitados
            },
            "HIV (Gestante T1)": {
              "Oportunidades": atendimento.hiv_t1_obrigatorios,
              "Realizado":  atendimento.hiv_t1_obrigatorios_solicitados
            },
            "HIV (Gestante T3": {
              "Oportunidades": atendimento.hiv_t3_obrigatorios,
              "Realizado":  atendimento.hiv_t3_obrigatorios_solicitados
            },
            "Sífilis (Gestante T1)": {
              "Oportunidades": atendimento.sifilis_t1_obrigatorios,
              "Realizado":  atendimento.sifilis_t1_obrigatorios_solicitados
            },
            "Sífilis (Gestante T3)": {
              "Oportunidades": atendimento.sifilis_t3_obrigatorios,
              "Realizado":  atendimento.sifilis_t3_obrigatorios_solicitados
            },
            "Mamografia": {
              "Oportunidades": atendimento.mamografia_obrigatorias,
              "Realizado":  atendimento.mamografia_obrigatorias_solicitadas
            },
            "Marcadores de Consumo Alimentar": {
              "Oportunidades": atendimento.mca_obrigatorios,
              "Realizado":  atendimento.mca_obrigatorios_realizados
            },
            "Aferição de Pressão Arterial": {
              "Oportunidades": atendimento.pa_obrigatorios,
              "Realizado":  atendimento.pa_obrigatorios_informados
            },
            "Aferição de perímetro cefálico": {
              "Oportunidades": atendimento.pc_obrigatorios,
              "Realizado":  atendimento.pc_obrigatorios_informados
            },
            "Avaliação de Cartão de Vacina": {
              "Oportunidades": atendimento.vacina_obrigatorios,
              "Realizado":  atendimento.vacina_obrigatorios_realizados
            },
          }

          if (checklist.innerHTML === '') {
            for (const indicador in indicadores) {
              checklist.innerHTML += `
                <label>
                  <input type="checkbox" id="${indicador}">
                  <span>${indicador}</span>
                </label>
              `;
            }
          }

          producao[atendimento.profissional] = producao[atendimento.profissional] || {};
          producao[atendimento.profissional][competencia] = {
            diario: diario,
            indicadores: indicadores,
            total: atendimento.total_atendimentos
          }
        }

        const { data: profissionais_esus, error: erro_buscar_profissionais } = await sb.from('profissionais_esus').select('*');
        for (const profissional_esus of profissionais_esus) {
          if (!profissionais[profissional_esus.cns]) continue;
          listagemProfissional.add({
            nome: profissional_esus.profissional,
            cns: profissional_esus.cns
          });

          cnsParaNome[profissional_esus.cns] = profissional_esus.profissional;
        }

        cbo.innerHTML += '<option>'+[...cbos].join('</option><option>')+'</option>';
        filtrarProfissionais();
      })();
    </script>
  </body>
</html>
