      const atualizaIntervaloDataNascimento = () => {
        if (document.getElementsByName("modoIdadePaciente")[0].value == "-") return;
        if (document.getElementsByName("idadeDesejadaPaciente")[0].value == "") return;
        if (document.getElementsByName("tipoIdadePaciente")[0].value == "-") return;

        const multiplo = parseInt(document.getElementsByName("tipoIdadePaciente")[0].value);
        const idadeMeses = parseInt(document.getElementsByName("idadeDesejadaPaciente")[0].value)*multiplo;
        const modoCalculo = document.getElementsByName("modoIdadePaciente")[0].value;

        let dataMinima = new Date;
        let dataMaxima = new Date;

        switch (modoCalculo) {
          case "max":
            dataMinima.setMonth(dataMinima.getMonth() - idadeMeses);
          break;

          case "min":
            dataMinima.setMonth(dataMinima.getMonth() - (127)*12);
            dataMaxima.setMonth(dataMinima.getMonth() - idadeMeses);
          break;
        }

        if (idadeMeses == 0) {
          dataMinima = new Date;
          dataMaxima = new Date;
          switch (multiplo) {
            case 1:
              switch (modoCalculo) {
                case "max":
                  dataMinima.setDate(dataMinima.getDate() - 29);
                break;

                case "min":
                  dataMinima.setMonth(dataMinima.getMonth() - (127)*12);
                  dataMaxima.setDate(dataMaxima.getDate() - 29);
                break;
              }
            break;
            case 12:
              switch (modoCalculo) {
                case "max":
                  dataMinima.setMonth(dataMinima.getMonth() - 11);
                break;

                case "min":
                  dataMinima.setMonth(dataMinima.getMonth() - (127)*12);
                  dataMaxima.setMonth(dataMaxima.getMonth() - 11);
                break;
              }
            break;
           }
        }

        document.getElementsByName("data_nascimento")[0].value = "";
        document.getElementsByName("data_nascimento$lte")[0].value = dataMaxima.toISOString().split('T')[0];
        document.getElementsByName("data_nascimento$gte")[0].value = dataMinima.toISOString().split('T')[0];

              button("Pesquisar", () => {
                
                const coletor = {};
                for (let input of event.target.closest('form').querySelectorAll("select,input")) {
                  if (input.type === "checkbox"){
                    if (input.checked) {
                      coletor[input.name] = input.checked;
                    }
                    continue;
                  } 
                  if (input.tagName == "INPUT" && input.value == "") continue;
                  if (input.tagName == "SELECT" && input.value == "-") continue;
                  if (input.type === "reset") continue;

                  coletor[input.name] = input.value;
                }

                let naoIncluirFA = coletor.naoIncluirFA === true ? true : false;
                let operadorLogico = coletor.operador_logico;

                delete coletor.naoIncluirFA;
                delete coletor.operador_logico;

                console.log(coletor)

                let tabela = [['CNS','Nome do paciente','Nome da mãe','Data de Nascimento','Contato','Equipe','Micro-área']];

                        break;
                      }

                        break
                      }

                    filtrados += 1;

                });

                let dialogo = document.body.appendChild(dialog({
                  onclose: () => event.target.remove(),
                  style: {
                    overflowY: "hidden"
                  }
                },[
                  table(tabela)
                ]));
                
                dialogo.showModal();
                return false;

              },

      }

      listaDePacientes = JSON.parse(await localforage.getItem('listaPacientes')) || {headers: [],body: [],groups: {}};

      if (parseInt((localStorage.getItem("ultima_atualizacao") || 0)) < parseInt((new Date).toISOString().split("T")[0].split("-").join(""))) {

        const cadastros = ((await sb.from('listagem_pacientes').select('*')).data[0] || {

            headers: [],
            body: [],
            groups: {},
          }
        }).json_build_object;

      {
        const headers = {};
        listaDePacientes.headers.forEach((h, i) => headers[h] = i);
        listaDePacientes.body.forEach((linha, i) => listaDePacientes.body[i] = new Proxy(linha,{
          get: function (target, name) {
                return name in headers ? target[headers[name]] : undefined;
          }
        }));
      }

      for (const [name, list] of Object.entries(listaDePacientes.groups)) {

          for (const option of list) {
            if (!option) continue;

            options += `<option value="${option}">${option}</option>`;

          for (const select of selects) {

        for (let [campo,dados] of Object.entries(JSON.parse(ficha.campos))) {

            for (let dado of dados.dados) {

            }
            form.appendChild(field(campo,{type: "select",name: campo},options));

            continue;

            continue;

          for (let campo of form.querySelectorAll("input,select,textarea")) {
            if (campo.type != "checkbox" && campo.value === "") {
              alert(`Campo "${campo.name.replaceAll(":","")}" não pode ficar em branco!`);
              campo.focus();
              return false;
            }

            if (campo.type == "checkbox") {
              coletor[campo.name] = campo.getAttribute(campo.checked ? "ifTrue" : "ifFalse");
              continue;
            }

            if (campo.type == "date") {
              coletor[campo.name] = campo.value.split("-").reverse().join("/");
              continue;
            }
            
            coletor[campo.name] = campo.value;
          }

          coletor = Object.fromEntries(Object.entries(coletor).sort(([a],[b]) => a.localeCompare(b)));
          coletor["--"] = "--";

          coletor["Data de registro"] = new Date().toISOString().split("T")[0].split("-").reverse().join("/");
          coletor["Nome Profissional"] = lotacao.no_civil_profissional;
          coletor["CBO Profissional"] = lotacao.no_cbo;
          coletor["Código CBO Profissional"] = lotacao.co_cbo_2002;
          coletor["Numero do conselho de classe"] = lotacao.nu_conselho_classe;
          coletor["Unidade de Saúde"] = lotacao.no_unidade_saude;
          coletor["CNES Unidade de Saúde"] = lotacao.nu_cnes;
          coletor["Equipe"] = lotacao.nu_ine;
          coletor["INE EEquipe"] = lotacao.no_equipe;
          coletor["CPF Profissional"] = lotacao.nu_cpf;
          coletor["CNS Profissional"] = lotacao.nu_cns
          
          const { data:resposta, error } = await sb.from('fichas_formulario_repostas').insert([
            { 
              cns: coletor["CNS:"],
              ficha: ficha.arquivo,
              versao: ficha.versao,
              dados: JSON.stringify(coletor)
            },
          ]).select();

          open(`fichas/${ficha.versao}/${ficha.arquivo}?id=${resposta[0].id}`)
          dialogo.close();
        };

        item.onclick = () => dialogo.showModal();
      }

      loadingDialog.remove();
    })();
  </script>  
</html>
