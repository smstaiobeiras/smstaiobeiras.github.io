    Estoque atualizado em <span id="dataAtualizacao"></span>

    <div id="montarReceituario">
      <table id="listaFarmacias">
        <tbody>
        </tbody>

      <fieldset style="display: none;">
        <table>

    <div id="resultadoBusca" style="display: none;">
      <button onclick="resultadoBusca.style.display = 'none';montarReceituario.style.display = '';">Voltar para a lista de farmácias</button>
      <br><br>
      <table>
        <tbody id="listaMedicamentosUnidades"></tbody >
      </table>
    </div>

    <h3><br /></h3>
    <script>
      let medicamentos = [];
      let unidades = {
        "FARMACIA DE MINAS": {
          icone: "farmacia-minas.jpg",
          endereco: "Avenida São João, nº 59 - Centro.",
          codigo: "190",
        },
        "UAPS DONA NININHA": {
          icone: "uaps.jpg",
          endereco: "Rua Guaicurus, 1625 - Sagrada Família.",
          codigo: "91",
        },
        "UAPS MARY TATIANE ANTUNES LOPES": {
          icone: "uaps.jpg",
          endereco: "Rua Santa Rita de Cássia, 1555 - Bom Jardim.",
          codigo: "92",
        },
        "UAPS MILTON MENDES DA SILVA": {
          icone: "uaps.jpg",
          endereco: "Avenida JK, 150 - Santos Cruzeiro.`",
          codigo: "93",
        },
        "UAPS VEREADOR JOSE SENA": {
          icone: "uaps.jpg",
          endereco: "Rua Bom fim, 136 - Centro",
          codigo: "104",
        },
        "UAPS VEREADOR MANOEL DOS SANTOS SILVA": {
          icone: "uaps.jpg",
          endereco: "Rua Paraíba, 170 - Planalto.",
          codigo: "90",
        },
      };

      function pesquisarFarmacia(farmacia) {
        montarReceituario.style.display = 'none';
        listaMedicamentosUnidades.innerHTML = "";
        resultadoBusca.style = "";

        listaMedicamentosUnidades.innerHTML += `<tr class="header border">
          <td colspan=2>
            <b>${farmacia}</b><br>
            ${unidades[farmacia].endereco}
            </td>
          </tr>
        `;
        listaMedicamentosUnidades.innerHTML += `
          <tr>
            <td class="border"><b>Medicamento</b></td>
            <td class="border" style="text-align:center;white-space:nowrap;"><b>Em estoque</b></td>
          </tr>
        `;

        for (let [medicamento,estoques] of Object.entries(medicamentos)) {
          if (!estoques[unidades[farmacia].codigo]) continue;
          listaMedicamentosUnidades.innerHTML += `
            <tr>
              <td class="border">${medicamento}</td>
              <td class="border" style="text-align:right;">${estoques[unidades[farmacia].codigo]}</td>
            </tr>
          `;
        }

        listaMedicamentosUnidades.innerHTML += `<tr><td><br></td></tr>`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    </script>
    <script>
      const supabaseUrl = 'https://gnbbejevwbixsubblnua.supabase.co';
      const supabaseKey = 'sb_publishable_qwyezy8HKpxXhQZJdCcfXw_VsmZLmLA';
      let sb = supabase.createClient(supabaseUrl, supabaseKey);

      (async () => {
        let { data: estoques, error } = await sb.from('estoques').select("*").eq('nome', 'farmacia');

        medicamentos = JSON.parse(estoques[0].dados);

        let data = estoques[0].created_at.split("T")[0].split("-").reverse().join("/");
        let hora = estoques[0].created_at.split("T")[1].split(".")[0];
        
        dataAtualizacao.innerHTML = `${data} às ${hora}`;

        let seletorUnidades = ``;
        for (let [unidade,dados] of Object.entries(unidades)) {
          seletorUnidades += `
            <tr class="border tr" data-page="/webapps/apps/farmacia-facil.html" tabindex="0" role="button" aria-label="Abrir ${unidade}" onclick="pesquisarFarmacia('${unidade}')">
              <td>
                <img src="/webapps/assets/img/${dados.icone}" width="72" alt="Ícone Farmácia">
              </td>
              <td>
                <b>${unidade}</b><br>
                ${dados.endereco}
              </td>
            </tr>
          `;
        }
        listaFarmacias.innerHTML = seletorUnidades;
      })();
    </script>
