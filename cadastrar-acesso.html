<!DOCTYPE html>
<html lang="pt_BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="preload" href="https://unpkg.com/@supabase/supabase-js@2" as="script">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/main.css">
    <style>
      body {
        background-image: url("img/bg.jpg");
      }
    </style>
  </head>
  <body>
    <dialog id="login" style="border: 0;position: absolute;top: 50%;transform: translate(0%, -50%);" open="true">
      <center-box>
        <img src="img/logo-prefeitura.png">
      </center-box>
      <label style="display: flex;align-items: center;margin-top: 16px;">
        CPF:
        <input type="text" id="cpf" oninput="applyCPFFormat(this)" style="padding-left: 12px;padding-right: 12px;margin-left: 8px;" style="height: 100%;">
      </label>
      <label style="display: flex;align-items: center;margin-top: 16px;">
        
        <span style="flex: 1;">Senha:</span>
        <input id="senha" type="password" style="height: 38px;border-right: 0px;border-top-right-radius: 0px;border-bottom-right-radius: 0px; margin-left: 8px;padding-left: 12px;padding-right: 12px;max-width: 220px;">
            <button  style="min-height: 38px;min-width: 38px;border-left: 0px;border-top-left-radius: 0px;border-bottom-left-radius: 0px; display: flex; align-items: center; justify-content: center;" onclick="
                senha.type = senha.type == 'password' ? 'text' : 'password';
              ">
              <svg width="14px" height="14px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 2L22 22" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M6.71277 6.7226C3.66479 8.79527 2 12 2 12C2 12 5.63636 19 12 19C14.0503 19 15.8174 18.2734 
                  17.2711 17.2884M11 5.05822C11.3254 5.02013 11.6588 5 12 5C18.3636 5 22 12 22 12C22 12 21.3082 
                  13.3317 20 14.8335" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M14 14.2362C13.4692 14.7112 12.7684 15.0001 12 15.0001C10.3431 15.0001 9 13.657 9 
                  12.0001C9 11.1764 9.33193 10.4303 9.86932 9.88818" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </button>
      </label>

      <label style="display: flex;align-items: center;margin-top: 16px;text-wrap: nowrap;">
        Confirme a senha:
        <input id="confirmarSenha" type="password" style="height: 38px;border-right: 0px;border-top-right-radius: 0px;border-bottom-right-radius: 0px; margin-left: 8px;padding-left: 12px;padding-right: 12px;">
            <button  style="min-height: 38px;min-width: 38px;border-left: 0px;border-top-left-radius: 0px;border-bottom-left-radius: 0px; display: flex; align-items: center; justify-content: center;" onclick="
                senha.type = senha.type == 'password' ? 'text' : 'password';
              ">
              <svg width="14px" height="14px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 2L22 22" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M6.71277 6.7226C3.66479 8.79527 2 12 2 12C2 12 5.63636 19 12 19C14.0503 19 15.8174 18.2734 
                  17.2711 17.2884M11 5.05822C11.3254 5.02013 11.6588 5 12 5C18.3636 5 22 12 22 12C22 12 21.3082 
                  13.3317 20 14.8335" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M14 14.2362C13.4692 14.7112 12.7684 15.0001 12 15.0001C10.3431 15.0001 9 13.657 9 
                  12.0001C9 11.1764 9.33193 10.4303 9.86932 9.88818" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </button>
      </label>

      <br>
      <span style="color: rgb(200, 56, 30);padding: 16px !important;" id="erro"></span>

      <right-box style="margin-top: 16px;align-items: center;">
        <a href="login.html" style="color: dodgerblue;">Voltar</a>
        <span style="margin-left: 16px;">|</span>
        <a href="recuperar-acesso.html" style="color: rgb(200, 56, 30);margin-left: 16px;">Esqueci a senha</a>
        <span style="margin-left: 16px;">|</span>
        <button onclick="signup();" style="margin-left: 16px;">Cadastrar</button>
      </right-box>
    </dialog>

    <header style="min-height: 48px; background: #000000; color: #ffffff;">
      <div></div>
      <middle-center-box>Acesso restrito</middle-center-box>
      <middle-right-box style="padding-right:9px;"></middle-right-box>
    </header>
    <main>
      <div style="padding: 26px;">
        
      </div>
    </main>
    <footer style="display: none;">
      <div>Esquerda rodapé</div>
      <div>Centro rodapé</div>
      <div>Direita rodapé</div>
    </footer>
    <script>
      ['card-book','card-box','card-label','list-item'].forEach((t) => customElements.define(t, class extends HTMLElement {}));
    </script>
    <script>
      const supabaseUrl = 'https://gnbbejevwbixsubblnua.supabase.co';
      const supabaseKey = 'sb_publishable_qwyezy8HKpxXhQZJdCcfXw_VsmZLmLA';
      let sb = supabase.createClient(supabaseUrl, supabaseKey);

      function applyCPFFormat(input) {
        let value = input.value.replace(/\D/g, '');
        let cpf = value;
        let cpfRegex = /^\d{3}\.\d{3}\.\d{3}-\d{2}$/;
        value = value.replace(/^(\d{3})(\d{3})(\d{3})(\d{2}).*/, '$1.$2.$3-$4');
        input.value = value;
      }

      async function signup() {
        if (cpf.value == "") {
          erro.innerText = "*CPF não pode estar em branco";
          return;
        }

        if (senha.value.length < 8) {
          erro.innerText = "*A senha precisa ter pelo menos 8 caracteres";
          return;
        }

        if (senha.value == "") {
          erro.innerText = "*A senha não pode ficar em branco";
          return;
        }

        if (senha.value != confirmarSenha.value) {
          erro.innerText = "*A senha digitada e a senha de confirmação precisam ser iguais";
          return;
        }

        let { data, error } = await sb.auth.signUp({
          email: `${parseInt(document.getElementById("cpf").value.replaceAll(".","").replaceAll("-","")).toString(36)}@profissional.ext`,
          password: `${document.getElementById("senha").value}`,
        })

        if (!error) {
          login();
          return
        }

        erro.innerText = "Ocorreu um erro, parece que você já se cadastrou";
      }

      async function login() {
        const { data, error } = await sb.auth.signInWithPassword({
          email: `${parseInt(document.getElementById("cpf").value.replaceAll(".","").replaceAll("-","")).toString(36)}@profissional.ext`,
          password: `${document.getElementById("senha").value}`,
        });

        if (error) {
          document.getElementById('loginErro').showModal();
          console.log(error)
          return;
        }

        localStorage.setItem("profissional_cpf", `${document.getElementById("cpf").value.replaceAll(".","").replaceAll("-","")}`);
        location.href = "profissional.html";
      }
    </script>
  </body>
</html>
